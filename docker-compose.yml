# One command sets up everything:
#   docker compose up --build
# Postgres, migrations, the app on http://localhost:8000 and the demo data.

name: flash-sale

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
    ports:
      - "5433:5432"   # host 5433 -> container 5432
    volumes:
      - db-data:/var/lib/postgresql/data
      # flash_sale_test, for running pytest from your machine against localhost:5433
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_sale"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: flash-sale-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/flash_sale
      # Local-only default. Override with JWT_SECRET_KEY in your shell or a root .env file.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-only-secret-do-not-use-in-production}
      SEED_DEMO: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-demo-password}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
