name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flash_sale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flash_sale
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flash_sale_test
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-hs256
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run mypy app scripts

      - run: createdb -h localhost -U postgres flash_sale_test

      - run: uv run alembic upgrade head

      - run: uv run pytest
